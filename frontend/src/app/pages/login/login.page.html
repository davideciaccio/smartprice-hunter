<ion-header>
  <ion-toolbar color="primary">
    <ion-title>SmartPrice Hunter</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="d-flex flex-column justify-content-center h-100">
    <h2 class="text-center mb-4">Bentornato!</h2>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="credentials.email"></ion-input>
    </ion-item>

    <ion-item class="mb-3">
      <ion-label position="floating">Password</ion-label>
      <ion-input type="password" [(ngModel)]="credentials.password"></ion-input>
    </ion-item>

    <ion-button expand="block" (click)="onLogin()">Accedi</ion-button>
    
    <div class="text-center mt-3">
      <p>Non hai un account?</p>
      <ion-button fill="clear" (click)="goToRegister()">Registrati ora</ion-button>
    </div>
  </div>
</ion-content>

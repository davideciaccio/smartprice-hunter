<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crea Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="d-flex flex-column justify-content-center h-100">
    <h2 class="text-center mb-4">Unisciti a noi!</h2>

    <ion-item>
      <ion-label position="floating">Username</ion-label>
      <ion-input type="text" [(ngModel)]="userData.username"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" [(ngModel)]="userData.email"></ion-input>
    </ion-item>

    <ion-item class="mb-3">
      <ion-label position="floating">Password</ion-label>
      <ion-input type="password" [(ngModel)]="userData.password"></ion-input>
    </ion-item>

    <ion-button expand="block" color="secondary" (click)="onRegister()">Registrati</ion-button>
    
    <div class="text-center mt-3">
      <p>Hai già un account?</p>
      <ion-button fill="clear" (click)="goToLogin()">Torna al Login</ion-button>
    </div>
  </div>
</ion-content>

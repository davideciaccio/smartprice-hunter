<ion-content class="x-theme-content">
  <div class="x-layout-wrapper">
    
    <div class="register-wrapper">
      <h1>Crea account</h1>
      <h2 class="subtitle">Unisciti a noi!</h2>

      <div class="register-card">
        
        <img src="assets/logo.png" alt="SmartPrice Hunter Logo" class="brand-logo" />

        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" [(ngModel)]="userData.username" (blur)="formatUsername()" placeholder="Inserisci username">
          <small class="error-msg" *ngIf="errors.username">{{ errors.username }}</small>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" [(ngModel)]="userData.email" placeholder="Inserisci email">
          <small class="error-msg" *ngIf="errors.email">{{ errors.email }}</small>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="userData.password" (input)="onPasswordInput()" placeholder="Crea password">
            <button type="button" class="eye-btn" tabindex="-1" (click)="togglePassword()">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5 0 .65.13 1.26.36 1.83l2.92-2.92c.15-.74.75-1.34 1.49-1.49l2.92-2.92C14.12 7.27 13.1 7 12 7zm0 10c-2.76 0-5-2.24-5-5 0-.77.18-1.5.49-2.14l1.47 1.47C8.4 11.84 8 12.37 8 13c0 2.21 1.79 4 4 4 1.28 0 2.38-.6 3.03-1.5l1.41 1.41C15.34 18.21 13.78 19 12 19zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
          
          <div class="strength-meter" *ngIf="userData.password">
            <div class="strength-bar" [ngClass]="{'weak': passwordStrength === 1, 'medium': passwordStrength === 2, 'strong': passwordStrength === 3}"></div>
          </div>
          
          <small class="error-msg" *ngIf="errors.password">{{ errors.password }}</small>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Conferma Password</label>
          <div class="password-wrapper">
            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" [(ngModel)]="userData.confirmPassword" placeholder="Ripeti la password">
            <button type="button" class="eye-btn" tabindex="-1" (click)="toggleConfirmPassword()">
              <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5 0 .65.13 1.26.36 1.83l2.92-2.92c.15-.74.75-1.34 1.49-1.49l2.92-2.92C14.12 7.27 13.1 7 12 7zm0 10c-2.76 0-5-2.24-5-5 0-.77.18-1.5.49-2.14l1.47 1.47C8.4 11.84 8 12.37 8 13c0 2.21 1.79 4 4 4 1.28 0 2.38-.6 3.03-1.5l1.41 1.41C15.34 18.21 13.78 19 12 19zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
              <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
          <small class="error-msg" *ngIf="errors.confirmPassword">{{ errors.confirmPassword }}</small>
        </div>

        <button class="btn-register" (click)="onRegister()">Registrati</button>

        <div class="login-link">
          <p>Hai già un account? <a (click)="goToLogin()">TORNA AL LOGIN</a></p>
        </div>

      </div> 
    </div>

    <!-- FOOTER -->
    <footer class="x-footer">
      <nav>
        <span>© 2026 SmartPrice Hunter</span>
      </nav>
    </footer>
    
  </div>
</ion-content>

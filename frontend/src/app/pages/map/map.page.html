<div class="dashboard-layout">
    
  <aside class="sidebar" [class.active]="isSidebarActive">
    <div class="brand">
      <img src="assets/logo.png" alt="SmartPrice Hunter Logo" class="sidebar-logo" />
    </div>
    
    <nav class="nav-menu">
      <ul>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <a routerLink="/dashboard">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            Sommario
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/price-history">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            Storico prezzi
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/map">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Mappa
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/camera">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/></svg>
            Fotocamera
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/notices">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            Avvisi
          </a>
        </li>
        
        <li class="nav-divider"></li>
        
        <li routerLinkActive="active">
          <a routerLink="/manage-account">
            <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Gestione account
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="sidebar-overlay" [class.active]="isSidebarActive" (click)="closeSidebar()"></div>

  <main class="main-content">
    
    <header class="topbar">
        <div class="title-area">
          <button type="button" class="mobile-menu-toggle" aria-label="Apri menu" (click)="toggleSidebar()">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          
          <div class="title-text">
            <h1>Mappa</h1>
            <p>Qui puoi usare la mappa!</p>
          </div>
        </div>
      </header>

      <section class="map-section">
      
      <div class="map-header">
        <div class="header-flex-container">
          
          <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" (click)="filterLocations()" title="Avvia ricerca">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>

            <input type="text" 
              [(ngModel)]="searchQuery" 
              (keyup.enter)="filterLocations()"
              placeholder="Cerca un negozio, una città, un CAP..." 
              class="search-input">

            <button *ngIf="searchQuery" class="clear-icon" (click)="clearSearch()" title="Annulla ricerca">
              <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
              </svg>
            </button>
          </div>

          <div class="nearby-control-group">
            <small class="instruction-text">Clicca per trovare negozi di elettronica nel raggio di 10 km.</small>
            
            <div class="nearby-buttons-row">
              <button class="btn-nearby" (click)="findNearbyElectronics()" [disabled]="isSearching">
                <span *ngIf="!isSearching">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                  </svg>
                  Cerca Negozi
                </span>
                <span *ngIf="isSearching">Ricerca...</span>
              </button>

              <button *ngIf="hasSearchedNearby" class="btn-cancel-nearby" (click)="cancelNearbySearch()" title="Annulla ricerca e pulisci la mappa">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
              </button>
            </div>
          </div>

        </div>
      </div>

      <div class="map-container">
        <div id="map"></div>

        <button class="geo-btn" (click)="locateUser()" title="Trova la mia posizione">
          <svg viewBox="0 0 24 24">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
        </button>
      </div>



    </section>
    

  </main>
</div>
